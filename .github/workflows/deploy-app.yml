# Publica Contabilidad/Bitácora (Worker) en app.exhatech.com
# El sitio marketing lo publica Cloudflare Pages por integración Git.
name: Deploy App Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-app-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Prepare app assets
        run: npm run cf:prepare

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
